name: Build & Release

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all tags

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Get project version from pom.xml
        id: project_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Get the latest tag (previous release)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Generate changelog
          if [ -z "$LATEST_TAG" ]; then
            # No previous tags, get all commit messages
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            # Get commits since the last tag
            CHANGELOG=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          
          # Handle empty changelog
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes since last release"
          fi
          
          # Save to output (handle multiline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn clean package

      - name: Create Git tag
        run: |
          git tag v${{ steps.project_version.outputs.version }}
          git push origin v${{ steps.project_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.project_version.outputs.version }}
          name: v${{ steps.project_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            target/soliditycore-${{ steps.project_version.outputs.version }}.jar